# Netlify 部署配置
# 纯静态站点 + 一个自建的同步接口（Netlify Functions + Netlify Blobs）
# 同步后端跑在你自己的站点上，不经过任何第三方服务。

[build]
  publish = "."
  # 同步接口要用 @netlify/blobs，所以构建时先装依赖（纯静态页面本身不需要构建）
  # --omit=dev 很重要：桌面版用的 Electron 是 devDependency，有 200MB 运行时，
  # 线上构建完全用不到它，跳过可以省下大量时间和风险。
  command = "npm install --omit=dev"

[functions]
  directory = "netlify/functions"

# ---- 同步接口 ----
# 把 /api/vault 转到那个函数上
[[redirects]]
  from = "/api/vault"
  to = "/.netlify/functions/vault"
  status = 200

# ---- 把内部文件挡在外面 ----
# publish = "." 会把仓库根目录整个发出去，下面这些是给开发用的，不该被公开访问。
# 放在同步接口规则**后面**，避免抢走 /api/vault。
#
# ⚠️⚠️ force = true 是关键，不能删！
# Netlify 的默认行为：**如果请求的路径上真有静态文件，文件赢，重定向被跳过。**
# 之前这几条没写 force，等于全是摆设 —— /package.json、/desktop/main.cjs、
# /netlify/functions/vault.mjs 后端源码全都是 200 可直接下载的。
# 加 force 才能强行覆盖。（注：/.netlify/ 开头的路径是平台保留的，force 也覆盖不了。）
[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/desktop/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

# 这两个现在本来就不存在，但万一以后构建把它们带上线，先钉死
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.workbuddy/*"
  to = "/404"
  status = 404
  force = true

# ---- 安全响应头 ----
[[headers]]
  for = "/*"
  [headers.values]
    # 内容安全策略：只准加载本站和 Google 字体的东西，别的域一律拒绝。
    # 没有它，一旦有人能往页面里塞东西，就能把你的密码偷走。
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    # 不许浏览器瞎猜文件类型（防止把 .txt 当 .js 执行）
    X-Content-Type-Options = "nosniff"
    # 不许别人把你的站嵌进 iframe 里做点击劫持
    X-Frame-Options = "DENY"
    # 跳转时不带来源地址，少泄露一点信息
    Referrer-Policy = "no-referrer"
    # 明确关掉定位/麦克风/摄像头等敏感能力
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
