# Netlify 部署配置
# 纯静态站点 + 一个自建的同步接口（Netlify Functions + Netlify Blobs）
# 同步后端跑在你自己的站点上，不经过任何第三方服务。

[build]
  publish = "."
  # 同步接口要用 @netlify/blobs，所以构建时先装依赖（纯静态页面本身不需要构建）
  # --omit=dev 很重要：桌面版用的 Electron 是 devDependency，有 200MB 运行时，
  # 线上构建完全用不到它，跳过可以省下大量时间和风险。
  command = "npm install --omit=dev"

[functions]
  directory = "netlify/functions"

# ---- 同步接口 ----
# 把 /api/vault 转到那个函数上
[[redirects]]
  from = "/api/vault"
  to = "/.netlify/functions/vault"
  status = 200

# ---- 挡掉 Netlify 强制注入的角标脚本 ----
# Netlify 会在每个页面 </html> 之后插入 /.netlify/scripts/hud，渲染「技术支持来自 Netlify」角标。
# 后台开关（Project configuration > General > Powered by Netlify badge）在某些账号/语言下看不到，
# 所以这里直接在边缘把它 404 掉 —— 脚本加载失败，角标就画不出来。
# 注意：只匹配这一个路径，绝不能用 /.netlify/* 通配，否则会连同步接口一起挡掉。
[[redirects]]
  from = "/.netlify/scripts/hud"
  to = "/404"
  status = 404
  force = true

# ---- 把内部文件挡在外面 ----
# publish = "." 会把仓库根目录整个发出去，下面这些是给开发用的，不该被公开访问。
# 放在同步接口规则**后面**，避免抢走 /api/vault。
[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
