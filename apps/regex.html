<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正则表达式测试</title>
  <meta name="description" content="在线试正则：写表达式、看匹配结果、看每个捕获组抓到了什么。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
  <style>
    #nl-badge-frame, #nl-hud-frame { display: none !important; }
    .hit{background:var(--brand-soft);border-radius:3px;padding:0 2px}
    .match{border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--sp-3);margin-bottom:8px;
      background:var(--bg-subtle);font-size:.9rem;line-height:1.8}
    .match .idx{color:var(--brand);font-size:.8rem}
  </style>
</head>
<body data-page="apps">
  <div id="nl-badge-frame" hidden aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="brand-mark">◇</span><span class="brand-name">我的工具箱</span></a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/apps/" class="is-active">工具箱</a>
        <a href="/vault.html">保险库</a>
        <button class="theme-toggle" id="theme-toggle" type="button" title="切换深浅色">◐</button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="/apps/">← 返回工具箱</a>
    <div class="tool-head">
      <h1>正则表达式测试</h1>
      <p>写完立刻看到匹配到什么、每个括号抓到了什么。改一下标志位（g/i/m）结果就不一样。</p>
    </div>

    <div class="panel">
      <div class="field">
        <label>正则表达式</label>
        <input id="re" type="text" value="(\d{4})-(\d{2})-(\d{2})" spellcheck="false">
      </div>
      <div class="field">
        <label>标志</label>
        <div class="chips" id="flags">
          <button class="chip on" data-f="g" type="button">g 全部匹配</button>
          <button class="chip" data-f="i" type="button">i 忽略大小写</button>
          <button class="chip" data-f="m" type="button">m 多行</button>
          <button class="chip" data-f="s" type="button">s 点匹配换行</button>
        </div>
      </div>
      <div class="field">
        <label>待匹配的文本</label>
        <textarea id="text" spellcheck="false">今天是 2026-10-14，明天是 2026-10-15。
我的邮箱是 someone@example.com，电话 13800138000。</textarea>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="go" type="button">测试</button>
        <button class="btn btn-ghost" id="replace" type="button">试替换</button>
        <input id="rep" type="text" placeholder="替换成（可用 $1 $2）" value="$1年$2月$3日">
      </div>
      <div class="result is-empty" id="out">结果会显示在这里</div>
    </div>

    <div class="panel">
      <h2>常用片段（点一下就能用）</h2>
      <div class="chips" id="samples">
        <button class="chip" data-re="\d+" type="button">数字</button>
        <button class="chip" data-re="[a-zA-Z]+" type="button">英文字母</button>
        <button class="chip" data-re="[\u4e00-\u9fff]+" type="button">中文</button>
        <button class="chip" data-re="^[\w.+-]+@[\w-]+\.[\w.]+$" type="button">邮箱</button>
        <button class="chip" data-re="1[3-9]\d{9}" type="button">手机号</button>
        <button class="chip" data-re="\d{17}[\dXx]" type="button">身份证</button>
        <button class="chip" data-re="https?://[^\s]+" type="button">网址</button>
        <button class="chip" data-re="\s+" type="button">空白</button>
      </div>
      <p class="hint muted">
        小提示：<code>\d</code> 数字、<code>\w</code> 字母数字下划线、<code>\s</code> 空白、
        <code>+</code> 一个或多个、<code>*</code> 零个或多个、<code>?</code> 零或一个、
        <code>{n,m}</code> 重复 n 到 m 次、<code>^</code> 开头、<code>$</code> 结尾。
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy"><a href="/apps/">工具箱</a> · 本地运行 · <span id="year"></span></p>
    </div>
  </footer>

  <script src="/assets/js/app-shell.js"></script>
  <script>
  var flagsOn = { g: true, i: false, m: false, s: false };
  var isReplace = false;

  document.getElementById('flags').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    var f = b.dataset.f;
    flagsOn[f] = !flagsOn[f];
    b.classList.toggle('on', flagsOn[f]);
    run();
  });

  document.getElementById('samples').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    document.getElementById('re').value = b.dataset.re;
    run();
  });

  function run() {
    var out = document.getElementById('out');
    var pattern = document.getElementById('re').value;
    var text = document.getElementById('text').value;
    var flagStr = Object.keys(flagsOn).filter(function (k) { return flagsOn[k]; }).join('');

    out.innerHTML = '';
    if (!pattern) {
      out.className = 'result is-empty';
      out.textContent = '先写一个表达式';
      return;
    }

    var re;
    try {
      re = new RegExp(pattern, flagStr);
    } catch (e) {
      out.className = 'result is-error';
      var b = document.createElement('div'); b.className = 'big';
      b.textContent = '⚠ 表达式写错了：' + e.message;
      out.appendChild(b);
      return;
    }

    if (isReplace) {
      var rep = document.getElementById('rep').value;
      out.className = 'result';
      var bigR = document.createElement('div');
      bigR.className = 'big';
      bigR.textContent = '替换结果';
      out.appendChild(bigR);
      var pre = document.createElement('div');
      pre.className = 'steps';
      pre.style.whiteSpace = 'pre-wrap';
      pre.textContent = text.replace(re, rep);
      out.appendChild(pre);
      return;
    }

    var results = [];
    var m;
    var guard = 0;
    var lastIndex = -1;
    while ((m = re.exec(text)) !== null && guard++ < 1000) {
      results.push({ index: m.index, full: m[0], groups: m.slice(1) });
      if (!flagsOn.g) break;
      if (m.index === lastIndex) { re.lastIndex++; }
      lastIndex = m.index;
      if (m[0] === '' && re.lastIndex >= text.length) break;
    }

    out.className = 'result';
    var big = document.createElement('div');
    big.className = 'big';
    big.textContent = results.length ? '匹配到 ' + results.length + ' 处' : '没有匹配到任何东西';
    out.appendChild(big);

    if (results.length) {
      // 高亮显示：把匹配处标出来
      var html = document.createElement('div');
      html.className = 'steps';
      html.style.whiteSpace = 'pre-wrap';
      html.innerHTML = '';
      var pos = 0;
      results.forEach(function (r) {
        if (r.index > pos) html.appendChild(document.createTextNode(text.slice(pos, r.index)));
        var span = document.createElement('span');
        span.className = 'hit';
        span.textContent = text.substr(r.index, r.full.length);
        html.appendChild(span);
        pos = r.index + r.full.length;
      });
      if (pos < text.length) html.appendChild(document.createTextNode(text.slice(pos)));
      out.appendChild(html);

      results.slice(0, 20).forEach(function (r, i) {
        var box = document.createElement('div');
        box.className = 'match';
        var idx = document.createElement('div');
        idx.className = 'idx';
        idx.textContent = '第 ' + (i + 1) + ' 处 · 位置 ' + r.index;
        box.appendChild(idx);
        var val = document.createElement('div');
        val.textContent = '整体：「' + r.full + '」';
        box.appendChild(val);
        if (r.groups.length) {
          var g = document.createElement('div');
          g.textContent = r.groups.map(function (x, k) { return '$' + (k + 1) + ' = 「' + (x === undefined ? '未匹配' : x) + '」'; }).join('　');
          box.appendChild(g);
        }
        out.appendChild(box);
      });
      if (results.length > 20) {
        var more = document.createElement('div');
        more.className = 'sub';
        more.textContent = '…… 只显示前 20 处，一共 ' + results.length + ' 处';
        out.appendChild(more);
      }
    }
  }

  document.getElementById('go').addEventListener('click', function () { isReplace = false; run(); });
  document.getElementById('replace').addEventListener('click', function () { isReplace = true; run(); });
  document.getElementById('re').addEventListener('input', function () { isReplace = false; run(); });
  document.getElementById('text').addEventListener('input', function () { run(); });
  run();
  </script>
</body>
</html>
