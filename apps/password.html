<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密码生成器</title>
  <meta name="description" content="用浏览器自带的随机数生成强密码，不上传、不记录。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
  <style>
    #nl-badge-frame, #nl-hud-frame { display: none !important; }
    .pw-out{font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:1.05rem;
      word-break:break-all;line-height:1.9}
  </style>
</head>
<body data-page="apps">
  <div id="nl-badge-frame" hidden aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="brand-mark">◇</span><span class="brand-name">我的工具箱</span></a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/apps/" class="is-active">工具箱</a>
        <a href="/vault.html">保险库</a>
        <button class="theme-toggle" id="theme-toggle" type="button" title="切换深浅色">◐</button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="/apps/">← 返回工具箱</a>
    <div class="tool-head">
      <h1>密码生成器</h1>
      <p>用的是浏览器自带的加密级随机数，<strong>密码不会离开这台设备</strong>，也不会被存下来。生成后建议存进<a href="/vault.html">保险库</a>。</p>
    </div>

    <div class="panel">
      <div class="row">
        <div class="field"><label>长度</label><input id="len" type="number" value="16" min="4" max="128" step="1"></div>
        <div class="field"><label>生成几条</label><input id="cnt" type="number" value="3" min="1" max="20" step="1"></div>
      </div>
      <div class="field">
        <label>用哪些字符</label>
        <label class="hint" style="display:flex;gap:8px;align-items:center"><input id="c-low" type="checkbox" checked style="width:auto"> 小写 abc…</label>
        <label class="hint" style="display:flex;gap:8px;align-items:center"><input id="c-up" type="checkbox" checked style="width:auto"> 大写 ABC…</label>
        <label class="hint" style="display:flex;gap:8px;align-items:center"><input id="c-num" type="checkbox" checked style="width:auto"> 数字 0-9</label>
        <label class="hint" style="display:flex;gap:8px;align-items:center"><input id="c-sym" type="checkbox" checked style="width:auto"> 符号 !@#$…</label>
        <label class="hint" style="display:flex;gap:8px;align-items:center"><input id="c-clear" type="checkbox" style="width:auto"> 去掉容易看混的（0/O/l/1/I）</label>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="go" type="button">生成</button>
        <button class="btn btn-ghost" id="copy" type="button">复制第一条</button>
      </div>
      <div class="result is-empty" id="out">点「生成」就会出现</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy"><a href="/apps/">工具箱</a> · 本地运行 · <span id="year"></span></p>
    </div>
  </footer>

  <script src="/assets/js/app-shell.js"></script>
  <script>
  var LOW = 'abcdefghijklmnopqrstuvwxyz';
  var UP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var NUM = '0123456789';
  var SYM = '!@#$%^&*()-_=+[]{};:,.<>?';

  var last = [];

  function buildPool() {
    var p = '';
    if (document.getElementById('c-low').checked) p += LOW;
    if (document.getElementById('c-up').checked) p += UP;
    if (document.getElementById('c-num').checked) p += NUM;
    if (document.getElementById('c-sym').checked) p += SYM;
    if (document.getElementById('c-clear').checked) {
      p = p.split('').filter(function (c) { return '0Ol1I'.indexOf(c) < 0; }).join('');
    }
    return p;
  }

  /* 用 crypto.getRandomValues —— 不是 Math.random，安全等级更高 */
  function randInt(max) {
    var limit = Math.floor(0xFFFFFFFF / max) * max;
    var buf = new Uint32Array(1);
    for (;;) {
      crypto.getRandomValues(buf);
      if (buf[0] < limit) return buf[0] % max;
    }
  }

  function make(len, pool) {
    var s = '';
    for (var i = 0; i < len; i++) s += pool[randInt(pool.length)];
    return s;
  }

  document.getElementById('go').addEventListener('click', function () {
    var out = document.getElementById('out');
    var pool = buildPool();
    var len = parseInt(document.getElementById('len').value, 10);
    var cnt = parseInt(document.getElementById('cnt').value, 10);

    function err(m) {
      out.className = 'result is-error';
      out.innerHTML = '';
      var b = document.createElement('div'); b.className = 'big'; b.textContent = '⚠ ' + m;
      out.appendChild(b);
    }
    if (!pool) { err('至少要勾一种字符'); return; }
    if (!isFinite(len) || len < 4 || len > 128) { err('长度填 4 ~ 128'); return; }
    if (!isFinite(cnt) || cnt < 1 || cnt > 20) { err('一次最多生成 20 条'); return; }

    last = [];
    for (var i = 0; i < cnt; i++) last.push(make(len, pool));

    var bits = Math.round(len * Math.log2(pool.length));
    var strong = bits >= 90 ? '很强' : bits >= 70 ? '够用' : bits >= 50 ? '一般' : '偏弱';

    out.className = 'result';
    out.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'pw-out';
    last.forEach(function (p) {
      var d = document.createElement('div');
      d.textContent = p;
      wrap.appendChild(d);
    });
    out.appendChild(wrap);

    var s = document.createElement('div');
    s.className = 'steps';
    s.textContent = '字符池 ' + pool.length + ' 个，长度 ' + len +
      ' → 大约 ' + bits + ' 位熵（' + strong + '）\n' +
      '参考：90 位以上基本不用担心被猜；重要账号建议 16 位以上、四种字符全开。';
    out.appendChild(s);
  });

  document.getElementById('copy').addEventListener('click', function () {
    if (!last.length) return;
    var btn = this;
    navigator.clipboard.writeText(last[0]).then(function () {
      var old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = old; }, 1200);
    }).catch(function () {});
  });
  </script>
</body>
</html>
