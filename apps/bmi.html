<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMI 与健康体重</title>
  <meta name="description" content="算 BMI，看中国标准和 WHO 标准的分类，给出健康体重范围。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
  <style>
    #nl-badge-frame, #nl-hud-frame { display: none !important; }
  </style>
</head>
<body data-page="apps">
  <div id="nl-badge-frame" hidden aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="brand-mark">◇</span><span class="brand-name">我的工具箱</span></a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/apps/" class="is-active">工具箱</a>
        <a href="/vault.html">保险库</a>
        <button class="theme-toggle" id="theme-toggle" type="button" title="切换深浅色">◐</button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="/apps/">← 返回工具箱</a>
    <div class="tool-head">
      <h1>BMI 与健康体重</h1>
      <p>BMI = 体重(kg) ÷ 身高(m)²。中国人和欧美用的评判线不一样，两个标准都给你。</p>
    </div>

    <div class="panel">
      <div class="row">
        <div class="field"><label>身高（厘米）</label><input id="h" type="number" value="170" step="0.5" min="50"></div>
        <div class="field"><label>体重（公斤）</label><input id="w" type="number" value="62" step="0.1" min="2"></div>
      </div>
      <button class="btn btn-primary" id="go" type="button">计算</button>
      <div class="result is-empty" id="out">结果会显示在这里</div>
    </div>

    <div class="panel">
      <h2>两个标准对照</h2>
      <table class="tbl">
        <thead><tr><th>分类</th><th>中国标准</th><th>WHO 标准</th></tr></thead>
        <tbody>
          <tr><td>偏瘦</td><td>&lt; 18.5</td><td>&lt; 18.5</td></tr>
          <tr><td>正常</td><td>18.5 ~ 23.9</td><td>18.5 ~ 24.9</td></tr>
          <tr><td>超重</td><td>24 ~ 27.9</td><td>25 ~ 29.9</td></tr>
          <tr><td>肥胖</td><td>≥ 28</td><td>≥ 30</td></tr>
        </tbody>
      </table>
      <p class="hint muted" style="margin-top:var(--sp-4)">
        BMI 只是个粗略参考：肌肉多的人会被高估，老人和青少年也不太适用。
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy"><a href="/apps/">工具箱</a> · 本地运行 · <span id="year"></span></p>
    </div>
  </footer>

  <script src="/assets/js/app-shell.js"></script>
  <script>
  function f(v) { return String(Math.round(v * 10) / 10); }

  function judgeCN(b) {
    if (b < 18.5) return '偏瘦';
    if (b < 24) return '正常';
    if (b < 28) return '超重';
    return '肥胖';
  }
  function judgeWHO(b) {
    if (b < 18.5) return '偏瘦';
    if (b < 25) return '正常';
    if (b < 30) return '超重';
    return '肥胖';
  }

  document.getElementById('go').addEventListener('click', function () {
    var out = document.getElementById('out');
    var h = parseFloat(document.getElementById('h').value);
    var w = parseFloat(document.getElementById('w').value);

    function err(msg) {
      out.className = 'result is-error';
      out.innerHTML = '';
      var b = document.createElement('div'); b.className = 'big'; b.textContent = '⚠ ' + msg;
      out.appendChild(b);
    }
    if (!isFinite(h) || !isFinite(w)) { err('身高体重都要填数字'); return; }
    if (h < 50 || h > 250) { err('身高填 50 ~ 250 厘米'); return; }
    if (w < 2 || w > 400) { err('体重填 2 ~ 400 公斤'); return; }

    var m = h / 100;
    var bmi = w / (m * m);
    var lo = 18.5 * m * m, hi = 23.9 * m * m;

    out.className = 'result';
    out.innerHTML = '';
    var big = document.createElement('div');
    big.className = 'big';
    big.textContent = 'BMI ' + f(bmi) + '（中国标准：' + judgeCN(bmi) + '）';
    out.appendChild(big);

    var s = document.createElement('div');
    s.className = 'steps';
    s.textContent =
      'BMI = ' + f(w) + ' ÷ (' + f(m) + ' × ' + f(m) + ') = ' + f(bmi) + '\n' +
      'WHO 标准：' + judgeWHO(bmi) + '\n' +
      '按中国标准，你这个身高的健康体重大约在 ' + f(lo) + ' ~ ' + f(hi) + ' 公斤之间。';
    out.appendChild(s);
  });
  </script>
</body>
</html>
