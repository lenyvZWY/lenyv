<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汇率换算</title>
  <meta name="description" content="各国货币换算，可以联网更新汇率，也可以自己填汇率离线用。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
  <style>
    #nl-badge-frame, #nl-hud-frame { display: none !important; }
  </style>
</head>
<body data-page="apps">
  <div id="nl-badge-frame" hidden aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="brand-mark">◇</span><span class="brand-name">我的工具箱</span></a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/apps/" class="is-active">工具箱</a>
        <a href="/vault.html">保险库</a>
        <button class="theme-toggle" id="theme-toggle" type="button" title="切换深浅色">◐</button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="/apps/">← 返回工具箱</a>
    <div class="tool-head">
      <h1>汇率换算</h1>
      <p>出国买东西、看外网上价格时用。默认带一组<strong>参考汇率</strong>，点「联网更新」可以拉最新的；断网就直接自己改数字，也能用。</p>
    </div>

    <div class="panel">
      <div class="row">
        <div class="field"><label>金额</label><input id="amt" type="number" value="100" step="any"></div>
        <div class="field"><label>从</label><select id="from"></select></div>
        <div class="field"><label>换成</label><select id="to"></select></div>
      </div>
      <div class="result is-empty" id="out">结果会显示在这里</div>
    </div>

    <div class="panel">
      <h2>汇率表（1 单位外币 = 多少人民币）</h2>
      <div class="row">
        <button class="btn btn-primary" id="upd" type="button">联网更新</button>
        <button class="btn btn-ghost" id="reset" type="button">恢复默认</button>
      </div>
      <div id="when" class="hint muted" style="margin:var(--sp-3) 0">当前用的是内置参考值</div>
      <div id="tbl"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy"><a href="/apps/">工具箱</a> · 本地运行 · <span id="year"></span></p>
    </div>
  </footer>

  <script src="/assets/js/app-shell.js"></script>
  <script>
  /* 参考汇率：1 单位外币折合多少人民币。联网更新会覆盖掉。 */
  var DEFAULT = {
    CNY: 1, USD: 7.10, EUR: 7.70, JPY: 0.048, GBP: 9.10, KRW: 0.0052,
    HKD: 0.91, TWD: 0.222, SGD: 5.30, THB: 0.200, AUD: 4.70, CAD: 5.20,
    CHF: 8.00, MYR: 1.60, VND: 0.00028, RUB: 0.078, INR: 0.0850,
    NZD: 4.30, AED: 1.93, TRY: 0.200, IDR: 0.00044, PHP: 0.123
  };
  var NAMES = {
    CNY: '人民币', USD: '美元', EUR: '欧元', JPY: '日元', GBP: '英镑', KRW: '韩元',
    HKD: '港币', TWD: '新台币', SGD: '新加坡元', THB: '泰铢', AUD: '澳元', CAD: '加元',
    CHF: '瑞士法郎', MYR: '马来西亚林吉特', VND: '越南盾', RUB: '卢布', INR: '印度卢比',
    NZD: '新西兰元', AED: '阿联酋迪拉姆', TRY: '土耳其里拉', IDR: '印尼盾', PHP: '菲律宾比索'
  };

  var rates = Object.assign({}, DEFAULT);
  var whenEl = document.getElementById('when');

  try {
    var saved = localStorage.getItem('fx-rates');
    var savedAt = localStorage.getItem('fx-at');
    if (saved) {
      rates = Object.assign({}, DEFAULT, JSON.parse(saved));
      whenEl.textContent = '用的是 ' + (savedAt || '未知时间') + ' 存下的汇率';
    }
  } catch (e) {}

  var from = document.getElementById('from');
  var to = document.getElementById('to');
  Object.keys(DEFAULT).forEach(function (k) {
    [from, to].forEach(function (sel) {
      var o = document.createElement('option');
      o.value = k; o.textContent = k + ' ' + NAMES[k];
      sel.appendChild(o);
    });
  });
  from.value = 'USD'; to.value = 'CNY';

  function f(v) {
    if (v === 0) return '0';
    var a = Math.abs(v);
    if (a >= 1e7 || a < 0.0001) return v.toExponential(6);
    return String(Math.round(v * 1e6) / 1e6);
  }

  function convert() {
    var out = document.getElementById('out');
    var a = parseFloat(document.getElementById('amt').value);
    if (!isFinite(a)) { out.className = 'result is-empty'; out.textContent = '填个数字'; return; }
    var r = a * rates[from.value] / rates[to.value];
    out.className = 'result';
    out.innerHTML = '';
    var big = document.createElement('div');
    big.className = 'big';
    big.textContent = f(a) + ' ' + from.value + ' = ' + f(r) + ' ' + to.value;
    out.appendChild(big);
    var s = document.createElement('div');
    s.className = 'steps';
    s.textContent = '先折成人民币：' + f(a * rates[from.value]) + ' 元\n再换成 ' + to.value + '：' + f(r);
    out.appendChild(s);
  }

  function drawTable() {
    var box = document.getElementById('tbl');
    box.innerHTML = '';
    var tb = document.createElement('table');
    tb.className = 'tbl';
    var head = document.createElement('tr');
    ['币种', '1 单位 = 多少人民币', '手改'].forEach(function (t) {
      var th = document.createElement('th'); th.textContent = t; head.appendChild(th);
    });
    var thead = document.createElement('thead'); thead.appendChild(head); tb.appendChild(thead);
    var body = document.createElement('tbody');
    Object.keys(DEFAULT).forEach(function (k) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td'); td1.textContent = k + ' ' + NAMES[k];
      var td2 = document.createElement('td'); td2.textContent = f(rates[k]);
      var td3 = document.createElement('td');
      var ip = document.createElement('input');
      ip.type = 'number'; ip.step = 'any'; ip.value = rates[k];
      if (k === 'CNY') { ip.disabled = true; }
      ip.addEventListener('change', function () {
        var v = parseFloat(ip.value);
        if (isFinite(v) && v > 0) {
          rates[k] = v;
          try {
            localStorage.setItem('fx-rates', JSON.stringify(rates));
            localStorage.setItem('fx-at', '手动修改');
          } catch (e) {}
          whenEl.textContent = '用的是手动改过的汇率';
          drawTable(); convert();
        }
      });
      td3.appendChild(ip);
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      body.appendChild(tr);
    });
    tb.appendChild(body);
    box.appendChild(tb);
  }

  document.getElementById('upd').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '正在更新……';
    fetch('https://open.er-api.com/v6/latest/CNY')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.rates) throw new Error('返回的数据不对');
        var cn = j.rates;
        Object.keys(DEFAULT).forEach(function (k) {
          if (k === 'CNY') { rates[k] = 1; return; }
          if (cn[k] && cn[k] > 0) rates[k] = 1 / cn[k];   // 接口给的是 1 人民币 = 多少外币
        });
        var at = j.time_last_update_utc || new Date().toLocaleString('zh-CN');
        try {
          localStorage.setItem('fx-rates', JSON.stringify(rates));
          localStorage.setItem('fx-at', at);
        } catch (e) {}
        whenEl.textContent = '已更新：' + at;
        drawTable(); convert();
      })
      .catch(function (e) {
        whenEl.textContent = '联网更新失败（可能没网或被拦），现在还是参考值 —— 可以直接在下面格子里改。';
      })
      .then(function () { btn.disabled = false; btn.textContent = '联网更新'; });
  });

  document.getElementById('reset').addEventListener('click', function () {
    rates = Object.assign({}, DEFAULT);
    try { localStorage.removeItem('fx-rates'); localStorage.removeItem('fx-at'); } catch (e) {}
    whenEl.textContent = '已恢复内置参考值';
    drawTable(); convert();
  });

  from.addEventListener('change', convert);
  to.addEventListener('change', convert);
  document.getElementById('amt').addEventListener('input', convert);
  drawTable();
  convert();
  </script>
</body>
</html>
