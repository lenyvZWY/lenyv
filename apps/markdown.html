    .md-wrap{display:grid;gap:var(--sp-4);grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

    .md-out h1{font-size:1.5rem}.md-out h2{font-size:1.25rem}.md-out h3{font-size:1.08rem}
    .md-out p,.md-out li{color:var(--text-soft);font-size:.93rem;line-height:1.85}
    .md-out ul,.md-out ol{padding-left:1.4em;margin:.5em 0}

    <div class="panel">
      <div class="md-wrap">
        <div>
          <div class="field">
            <label>Markdown 源码</label>
            <textarea id="src" spellcheck="false"># 标题一

    <div class="container footer-inner">

    </div>
  </footer>

  <script src="/assets/js/app-shell.js"></script>
  <script>
  /* 一个够用的 Markdown 解析器。
     安全做法：先把 HTML 特殊字符转义掉，再做 Markdown 语法替换，
     这样源码里的 <script> 之类的东西不会被当成真的标签执行。 */
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, function (m, c) { return '<code>' + c + '</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, function (m, c) { return '<strong>' + c + '</strong>'; })
      .replace(/(^|[^*])\*([^*\n]+)\*/g, function (m, p, c) { return p + '<em>' + c + '</em>'; })
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
        return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + '</a>';
      });
  }

  function render(src) {
    var lines = src.replace(/\r\n/g, '\n').split('\n');
    var out = [];
    var inCode = false, codeLang = '', codeBuf = [];
    var listType = null;
    var para = [];

    function flushPara() {
      if (para.length) {
        out.push('<p>' + inline(esc(para.join('\n'))).replace(/\n/g, '<br>') + '</p>');
        para = [];
      }
    }
    function closeList() {
      if (listType) { out.push('</' + listType + '>'); listType = null; }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      // 代码块
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        flushPara(); closeList();
        if (!inCode) { inCode = true; codeLang = fence[1] || ''; codeBuf = []; }
        else {
          out.push('<pre><code' + (codeLang ? ' class="lang-' + codeLang + '"' : '') + '>' +
            esc(codeBuf.join('\n')) + '</code></pre>');
          inCode = false;
        }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }

      if (!line.trim()) { flushPara(); closeList(); continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { flushPara(); closeList(); out.push('<h' + h[1].length + '>' + inline(esc(h[2])) + '</h' + h[1].length + '>'); continue; }

      if (/^(---|\*\*\*)\s*$/.test(line)) { flushPara(); closeList(); out.push('<hr>'); continue; }

      var bq = line.match(/^>\s?(.*)$/);
      if (bq) { flushPara(); closeList(); out.push('<blockquote>' + inline(esc(bq[1])) + '</blockquote>'); continue; }

      var ul = line.match(/^\s*[-*+]\s+(.*)$/);
      var ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ul || ol) {
        flushPara();
        var want = ul ? 'ul' : 'ol';
        if (listType !== want) { closeList(); out.push('<' + want + '>'); listType = want; }
        out.push('<li>' + inline(esc((ul || ol)[1])) + '</li>');
        continue;
      }

      // 表格（简单支持）
      if (/^\|.*\|$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i + 1])) {
        flushPara(); closeList();
        var head = line.slice(1, -1).split('|').map(function (c) { return esc(c.trim()); });
        i += 2;
        var body = [];
        while (i < lines.length && /^\|.*\|$/.test(lines[i])) {
          body.push(lines[i].slice(1, -1).split('|').map(function (c) { return inline(esc(c.trim())); }));
          i++;
        }
        i--;
        var t = '<table><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>';
        body.forEach(function (r) { t += '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; });
        out.push(t + '</tbody></table>');
        continue;
      }

      closeList();
      para.push(line);
    }
    flushPara(); closeList();
    if (inCode) out.push('<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
    return out.join('\n');
  }

  var src = document.getElementById('src');
  var preview = document.getElementById('preview');
  var stat = document.getElementById('stat');

  function update() {
    var s = src.value;
    preview.innerHTML = render(s);
    var chars = s.length;
    var words = (s.trim().match(/[\u4e00-\u9fff]|[A-Za-z0-9_]+/g) || []).length;
    stat.textContent = chars + ' 个字符 · 约 ' + words + ' 个词 · ' + (s ? s.split('\n').length : 0) + ' 行';
  }
  src.addEventListener('input', update);
  update();

  document.getElementById('copyHtml').addEventListener('click', function () {
    var btn = this;
    navigator.clipboard.writeText(preview.innerHTML).then(function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制 HTML'; }, 1200);
    }).catch(function () {});
  });

  document.getElementById('download').addEventListener('click', function () {
    var blob = new Blob([src.value], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '笔记.md';
    a.click();
  });

  document.getElementById('clear').addEventListener('click', function () {
    src.value = '';
    update();
  });
  </script>
</body>
</html>
