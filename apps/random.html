<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机抽签</title>
  <meta name="description" content="课堂点名、随机分组、抽签决定顺序，也能生成随机数。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/tools.css">
  <style>
    #nl-badge-frame, #nl-hud-frame { display: none !important; }
    .pick-item{display:inline-block;padding:8px 14px;margin:4px;border:1px solid var(--border);
      border-radius:var(--r-sm);font-size:.95rem}
    .pick-item.hit{border-color:var(--brand);color:var(--brand);font-weight:600}
    .group-box{border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--sp-3);margin-bottom:8px}
  </style>
</head>
<body data-page="apps">
  <div id="nl-badge-frame" hidden aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="brand-mark">◇</span><span class="brand-name">我的工具箱</span></a>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/apps/" class="is-active">工具箱</a>
        <a href="/vault.html">保险库</a>
        <button class="theme-toggle" id="theme-toggle" type="button" title="切换深浅色">◐</button>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <a class="back-link" href="/apps/">← 返回工具箱</a>
    <div class="tool-head">
      <h1>随机抽签</h1>
      <p>点名、分组、决定谁先来。用的是浏览器自带的随机数，抽完不留记录。</p>
    </div>

    <div class="panel">
      <h2>名单抽签</h2>
      <div class="field">
        <label>名单（一行一个，也可以用逗号隔开）</label>
        <textarea id="list" placeholder="每行一个名字">张三
李四
王五
赵六
孙七
周八</textarea>
      </div>
      <div class="row">
        <div class="field"><label>抽几个（或分成几组）</label><input id="k" type="number" value="1" min="1" step="1"></div>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="b-pick" type="button">抽人</button>
        <button class="btn btn-ghost" id="b-group" type="button">分组</button>
        <button class="btn btn-ghost" id="b-order" type="button">排顺序</button>
      </div>
      <div class="result is-empty" id="out">结果会显示在这里</div>
    </div>

    <div class="panel">
      <h2>生成随机数</h2>
      <div class="row">
        <div class="field"><label>最小值（含）</label><input id="min" type="number" value="1"></div>
        <div class="field"><label>最大值（含）</label><input id="max" type="number" value="60"></div>
        <div class="field"><label>个数</label><input id="cnt" type="number" value="5" min="1"></div>
      </div>
      <label class="hint" style="display:flex;gap:8px;align-items:center;margin-bottom:var(--sp-4)">
        <input id="uniq" type="checkbox" checked style="width:auto"> 不重复（抽签用）
      </label>
      <button class="btn btn-primary" id="b-rand" type="button">生成</button>
      <div class="result is-empty" id="out2">结果会显示在这里</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy"><a href="/apps/">工具箱</a> · 本地运行 · <span id="year"></span></p>
    </div>
  </footer>

  <script src="/assets/js/app-shell.js"></script>
  <script>
  function readList() {
    var raw = document.getElementById('list').value;
    return raw.split(/[\n,，、;；]+/).map(function (s) { return s.trim(); })
      .filter(function (s) { return s !== ''; });
  }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function kVal() {
    var k = parseInt(document.getElementById('k').value, 10);
    if (!isFinite(k) || k < 1) throw new Error('「抽几个」要填一个不小于 1 的整数');
    return k;
  }
  function render(el, big, lines, err) {
    el.className = 'result' + (err ? ' is-error' : '');
    el.innerHTML = '';
    var b = document.createElement('div'); b.className = 'big';
    b.textContent = err ? '⚠ ' + err : big;
    el.appendChild(b);
    if (lines) {
      var s = document.createElement('div'); s.className = 'steps'; s.textContent = lines;
      el.appendChild(s);
    }
  }

  document.getElementById('b-pick').addEventListener('click', function () {
    var out = document.getElementById('out');
    try {
      var arr = readList();
      if (!arr.length) throw new Error('名单是空的');
      var k = kVal();
      if (k > arr.length) throw new Error('要抽 ' + k + ' 个，但名单只有 ' + arr.length + ' 个');
      var picked = shuffle(arr).slice(0, k);
      render(out, picked.join('、'), '从 ' + arr.length + ' 个人里抽 ' + k + ' 个');
    } catch (e) { render(out, null, null, e.message); }
  });

  document.getElementById('b-order').addEventListener('click', function () {
    var out = document.getElementById('out');
    try {
      var arr = readList();
      if (!arr.length) throw new Error('名单是空的');
      var order = shuffle(arr);
      var lines = order.map(function (n, i) { return (i + 1) + '. ' + n; }).join('\n');
      render(out, '顺序已排好（共 ' + order.length + ' 人）', lines);
    } catch (e) { render(out, null, null, e.message); }
  });

  document.getElementById('b-group').addEventListener('click', function () {
    var out = document.getElementById('out');
    try {
      var arr = readList();
      if (!arr.length) throw new Error('名单是空的');
      var g = kVal();
      if (g > arr.length) throw new Error('要分 ' + g + ' 组，但只有 ' + arr.length + ' 个人');
      var sh = shuffle(arr);
      var groups = [];
      for (var i = 0; i < g; i++) groups.push([]);
      sh.forEach(function (name, i) { groups[i % g].push(name); });

      out.className = 'result';
      out.innerHTML = '';
      var big = document.createElement('div');
      big.className = 'big';
      big.textContent = '分成 ' + g + ' 组，共 ' + arr.length + ' 人';
      out.appendChild(big);

      groups.forEach(function (gp, i) {
        var box = document.createElement('div');
        box.className = 'group-box';
        box.style.marginTop = '10px';
        var t = document.createElement('div');
        t.style.fontSize = '.85rem';
        t.style.color = 'var(--text-soft)';
        t.textContent = '第 ' + (i + 1) + ' 组（' + gp.length + ' 人）';
        box.appendChild(t);
        var line = document.createElement('div');
        line.textContent = gp.join('、');
        box.appendChild(line);
        out.appendChild(box);
      });
    } catch (e) { render(out, null, null, e.message); }
  });

  document.getElementById('b-rand').addEventListener('click', function () {
    var out = document.getElementById('out2');
    try {
      var lo = parseFloat(document.getElementById('min').value);
      var hi = parseFloat(document.getElementById('max').value);
      var n = parseInt(document.getElementById('cnt').value, 10);
      var uniq = document.getElementById('uniq').checked;
      if (!isFinite(lo) || !isFinite(hi)) throw new Error('最小值和最大值都要填数字');
      if (!isFinite(n) || n < 1) throw new Error('个数要填一个不小于 1 的整数');
      if (hi < lo) throw new Error('最大值不能比最小值小');

      var res = [];
      if (uniq) {
        var span = Math.floor(hi) - Math.ceil(lo) + 1;
        if (n > span) throw new Error('要不重复地取 ' + n + ' 个，但范围里一共只有 ' + span + ' 个数');
        var pool = [];
        for (var v = Math.ceil(lo); v <= Math.floor(hi); v++) pool.push(v);
        res = shuffle(pool).slice(0, n);
      } else {
        for (var i = 0; i < n; i++) res.push(Math.floor(lo + Math.random() * (hi - lo + 1)));
      }
      render(out, res.join('、'), '范围 ' + lo + ' ~ ' + hi + '，共 ' + res.length + ' 个' + (uniq ? '（不重复）' : '（可能重复）'));
    } catch (e) { render(out, null, null, e.message); }
  });
  </script>
</body>
</html>
