<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lenyv</title>
  <meta name="description" content="lenyv — 一个正在慢慢搭建的网站。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body data-page="home">
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="container">
        <span class="hero-eyebrow">lenyv</span>
        <h1 class="hero-title">慢慢搭起来的小站</h1>
        <p class="hero-sub">地基已经打好。之后会放上关于、作品、笔记，还有一个只属于我的私密小工具。</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/vault.html">打开保险库</a>
          <a class="btn btn-ghost" href="/about.html">关于我</a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <h2 class="section-title">入口</h2>
          <p class="section-sub">想往哪个方向填，挑一个。</p>
        </div>
        <div class="grid grid-2">
          <a class="card reveal" href="/about.html">
            <h3>关于</h3>
            <p>你是谁、在做什么、喜欢什么。</p>
          </a>
          <a class="card reveal" href="/projects.html">
            <h3>作品</h3>
            <p>做过的事情，慢慢攒起来。</p>
          </a>
          <a class="card reveal" href="/blog.html">
            <h3>笔记</h3>
            <p>想法、教程、随手记。</p>
          </a>
          <a class="card reveal" href="/vault.html">
            <h3>保险库</h3>
            <p>本地加密的密码本，钥匙在 U 盘里。</p>
          </a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="stats reveal">
          <div class="stat"><div class="num">极简</div><div class="label">只留必要的东西</div></div>
          <div class="stat"><div class="num">本地</div><div class="label">数据不出你的浏览器</div></div>
          <div class="stat"><div class="num">可改</div><div class="label">随时都能改</div></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-panel reveal">
          <h2>想加点什么？</h2>
          <p>作品、笔记，或者别的什么，说一声就行。</p>
          <a class="btn btn-ghost" href="/contact.html">聊聊</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/main.js"></script>
</body>
</html>
